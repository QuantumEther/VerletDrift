<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torque Driven Rolling Wheel Sandbox</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #111820; color: #e8eef4; }
    body { max-width: 850px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    .layout { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(210px, .7fr); gap: 1.5rem; align-items: center; }
    canvas { width: 100%; background: #18232e; border: 1px solid #405266; border-radius: 8px; }
    dl { display: grid; grid-template-columns: 1fr auto; gap: .45rem 1rem; }
    dt { color: #aebdca; } dd { margin: 0; font-variant-numeric: tabular-nums; }
    label { display: block; margin: .7rem 0; }
    input { width: 7rem; }
    .help { color: #afbdc8; line-height: 1.5; }
    @media (max-width: 650px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<h1>Two-axle side-view vehicle</h1><p>W rear drive · S both brakes · R reset · Space upward chassis impulse · B place an 8 cm bump ahead.</p>
<p>1 ms fixed step. Small-angle chassis pitch; shared horizontal translation. Front axle is on the right.</p>
<canvas id="wheel" width="620" height="360"></canvas>
<label>Rear drive torque (Nm) <input id="drive" type="number" value="20"></label>
<dl><dt>Speed</dt><dd id="speed"></dd><dt>Position</dt><dd id="position"></dd><dt>Chassis pitch</dt><dd id="pitch"></dd></dl>
<h2>Front</h2><p id="front"></p><h2>Rear</h2><p id="rear"></p><p id="warning"></p>
<script type="module" src="./src/main.js"></script></body></html>
